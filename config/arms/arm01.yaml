# Joint config for arm01, the 7 DOF test arm (spec: "Joint config").
#
# One per arm, checked in, changes rarely. The hardware fields are the
# MyActuator V4 datasheet values (sources in config/actuator_models.yaml);
# Phase 1 bench tests confirm or correct them. A field set to null falls back to
# the actuator model table and the code says so.
#
# max_torque_nm / max_vel_rad_s are the RT controller's per-joint clamps, and
# every calibration stage scales its excitation from them (PACE chirps run to
# 0.7 x max_vel). They are set to the model's BRING-UP limits, well under the
# datasheet ratings, until Phase 1 has checked signs, zeros and limits on the
# real arm (the calibration's `verified` and `mechanical_stops_measured`); raise
# them toward the rated values after that. Loading refuses a clamp above the
# datasheet rated torque, or above the peak with `use_peak_torque_limit: true`
# (short tests only: the peak is not a continuous rating, see
# config/actuator_models.yaml).
#
# Read by both sides: the launch file (bus positions, models, directions ->
# EtherCAT slave configs and the ros2_control block) and arm_stack (units,
# limits, gains). Joint names match urdf/arm01/arm01.urdf.
#
# bus_position: physical place on the ring, 0 = first drive after the master
#   (the spec's `slave`, minus one).
# direction: +1 if a positive drive count moves the joint positively about its
#   URDF axis. `arm bringup` checks it and reports a mismatch.

arm: arm01
urdf: urdf/arm01/arm01.urdf
bus: {iface: enp3s0, cycle_us: 1000, dc_sync: true}

# Resting pose every stage starts from and returns to (rad, 3 deg inside the limits
# when used): the arm hanging straight down from its stand (J1 +90 deg, everything
# else 0), where it settles by itself with the drives off. The URDF's q = 0 is the
# arm stretched out forward, its worst gravity load. There is no base plate under
# the stand (2026-11-23; the earlier 45 deg elbow cleared one). Also the zeroing jig
# pose unless `jig_pose_rad` is given.
home_pose_rad:
  shoulder_pitch: 1.5708
  shoulder_roll: 0.0
  shoulder_yaw: 0.0
  elbow: 0.0
  forearm_yaw: 0.0
  wrist_pitch: 0.0
  wrist_yaw: 0.0

# velocity (CSV), effort (CST), or arm (CSP + CST with runtime switching, the
# spec's Mode P / Mode T; needs the ArmController).
control_mode: arm

# Self-collision keep-outs (URDF joint angles, deg). While `gate` is below `gate_min`,
# `joint` must stay within [lower, upper]: the control law clamps targets into that
# (arm_law.hpp / arm_stack/control/law.py), whatever the soft limits allow.
# J1 swinging far with J2 rolled in drives the upper arm into the shoulder plate. By
# hand, drives off (2026-11-23): contact at +39 deg back and -38 deg forward from
# hanging (J1 = 90) with J2 at 0, growing with J2 (+55 at J2 2 deg); J2 clears it by
# ~10 deg. Band: hanging +-30; gate 15 deg. Verified powered at the gate: J1 crept clear
# to +150 and -30 deg, and with J2 in J1 stopped at the 120 deg band edge (2026-11-23).
keep_out_deg:
  - {joint: shoulder_pitch, lower: 60.0, upper: 120.0, gate: shoulder_roll, gate_min: 15.0}

joints:
  - name: shoulder_pitch      # J1, ROM -150..+150 deg (operating range; no hard stop)
    bus_position: 0
    model: x6_60
    direction: 1
    # The CAD export found no intrinsic J1 stop (clear at -93 and +183 deg). Its range is
    # set on the arm instead: +-150 deg (2026-11-23; URDF limit, overridden in
    # tools/cad/import_full_assembly.py). `arm limits` keeps it as the soft limits instead
    # of driving J1 into the cables. Remove once a physical stop is fitted.
    hard_stops: false
    gear_ratio: 19.612  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (X6-60: 17-bit output encoder, V4 manual)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 9.5  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 12.0  # bring-up clamp (x6_60: datasheet rated 20 Nm, peak in the model table)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 153 rpm = 16.0 rad/s)
    gains: {kp: 60.0, kd: 2.0}
  - name: shoulder_roll       # J2, ROM 0..+190 deg
    bus_position: 1
    model: x6_60
    # -1 from the 2026-11-23 stop-zero gravity traces: hanging (zero gravity) is 2 deg from the +count stop and the arm sweeps
    # 178 deg toward -counts; the URDF hangs at roll 0, its LOWER end.
    direction: -1
    gear_ratio: 19.612  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (X6-60: 17-bit output encoder, V4 manual)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 9.5  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 12.0  # bring-up clamp (x6_60: datasheet rated 20 Nm, peak in the model table)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 153 rpm = 16.0 rad/s)
    gains: {kp: 60.0, kd: 2.0}
  - name: shoulder_yaw        # J3, ROM -90..+90 deg
    bus_position: 2
    model: x4_36
    direction: -1   # flipped 2026-11-23 by the powered direction check
    gear_ratio: 36  # datasheet
    counts_per_rev: 262144  # 0x6064 per output rev (18-bit; J5 jog 2026-11-23: 131072 read 2x)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 6.1  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 10.0  # raised from the 6 Nm bring-up clamp: the real forearm needs ~5 Nm at
                         # 26 deg elbow (x4_36: datasheet rated 10.5 Nm, peak in the model table)
    max_torque_permille: 1035  # 0x6072 drive cap 12.0 Nm, 1.2 x the clamp (model default 620 = 7.2 Nm)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 83 rpm = 8.7 rad/s)
    gains: {kp: 30.0, kd: 1.0}
  - name: elbow               # J4, ROM 0..+130 deg
    bus_position: 3
    model: x4_36
    # -1 from the 2026-11-23 stop-zero gravity traces: the +count stop is 28 deg from hanging, the -count stop 116 deg; the URDF
    # hangs near elbow 5 deg, 10 deg above its LOWER stop, and +1 put the 8 Nm gravity peak there.
    direction: -1
    gear_ratio: 36  # datasheet
    counts_per_rev: 262144  # 0x6064 per output rev (18-bit; J5 jog 2026-11-23: 131072 read 2x)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 6.1  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 15.0  # above the 10.5 Nm rating: stop-zero stalled lifting the forearm at
                         # 7.2 Nm (+31.7 deg); it needs ~10 Nm at horizontal (x4_36 peak 34 Nm)
    use_peak_torque_limit: true  # short tests only: the peak is not a continuous rating
    max_torque_permille: 1553  # 0x6072 drive cap 18.0 Nm, 1.2 x the clamp (model default 620 = 7.2 Nm)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 83 rpm = 8.7 rad/s)
    gains: {kp: 30.0, kd: 1.0}
  - name: forearm_yaw         # J5, ROM -90..+90 deg
    bus_position: 4
    model: x4_36
    direction: 1
    gear_ratio: 36  # datasheet
    counts_per_rev: 262144  # 0x6064 per output rev (18-bit; J5 jog 2026-11-23: 131072 read 2x)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 6.1  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 10.0  # raised from the 6 Nm bring-up clamp: the real forearm needs ~5 Nm at
                         # 26 deg elbow (x4_36: datasheet rated 10.5 Nm, peak in the model table)
    max_torque_permille: 1035  # 0x6072 drive cap 12.0 Nm, 1.2 x the clamp (model default 620 = 7.2 Nm)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 83 rpm = 8.7 rad/s)
    gains: {kp: 20.0, kd: 0.6}
  - name: wrist_pitch         # J6, ROM -35..+35 deg
    bus_position: 5
    model: x4_10
    direction: 1
    gear_ratio: 12.5  # datasheet
    counts_per_rev: 262144  # 0x6064 per output rev (18-bit; stop-zero 2026-11-23: 131072 read 2x)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 7.8  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 2.5  # bring-up clamp (x4_10: datasheet rated 4.0 Nm, peak in the model table)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 238 rpm = 24.9 rad/s)
    gains: {kp: 10.0, kd: 0.3}
    # drive speed loop, tuned 2026-11-23 (factory spd_kp 0.005864, spd_ki 4.2e-6 stick-slipped:
    # held 57% / 24% of moving cycles on J6 / J7, now 35% / 9%; no oscillation up to spd_ki 1e-3)
    # pos_kp (factory 0.037699): 2026-11-23 sweep at the corrected scale, ripple 0.050 -> 0.039 deg at
    # 0.15; 0.3 smoother still, 0.6 oscillated J7 at rest (0.18 deg), so 0.15 keeps 4x margin
    drive_gains: {spd_kp: 0.03, spd_ki: 3.0e-4, pos_kp: 0.15}
  - name: wrist_yaw           # J7, ROM -90..+90 deg
    bus_position: 6
    model: x4_10
    direction: -1   # flipped 2026-11-23 by the powered direction check
    gear_ratio: 12.5  # datasheet
    counts_per_rev: 262144  # 0x6064 per output rev (18-bit; stop-zero 2026-11-23: 131072 read 2x)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 7.8  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    max_torque_nm: 2.5  # bring-up clamp (x4_10: datasheet rated 4.0 Nm, peak in the model table)
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 238 rpm = 24.9 rad/s)
    gains: {kp: 10.0, kd: 0.3}
    # drive speed loop, tuned 2026-11-23 (factory spd_kp 0.005864, spd_ki 4.2e-6 stick-slipped:
    # held 57% / 24% of moving cycles on J6 / J7, now 35% / 9%; no oscillation up to spd_ki 1e-3)
    # pos_kp (factory 0.037699): 2026-11-23 sweep at the corrected scale, ripple 0.050 -> 0.039 deg at
    # 0.15; 0.3 smoother still, 0.6 oscillated J7 at rest (0.18 deg), so 0.15 keeps 4x margin
    drive_gains: {spd_kp: 0.03, spd_ki: 3.0e-4, pos_kp: 0.15}

# Weighed at assembly, one per link (kg). null: the URDF's placeholder mass is used.
link_masses_kg:
  link1: null
  link2: null
  link3: null
  link4: null
  link5: null
  link6: null
  link7: null

# Flange marker cluster for arm mocap-calib / mocap-repeat / validate.
# topic: geometry_msgs/PoseStamped of the cluster in the mocap frame (null: no mocap).
# length_bar_error_m: absolute error from the calibrated length bar moved through the
#   workspace; it caps the accuracy any fit can reach (pass = 2x this).
mocap:
  topic: null
  length_bar_error_m: null

# Optional fixed validation poses (rad, 7 per pose). Empty: feasible random poses.
validation:
  # ISO 9283 poses on the 135 mm cube at (0.170, -0.490, 0.210) from tools/workspace_map.py
  # (README model-analysis notes; regenerate with tools/workspace_map.py): one tool orientation, cond 15-51, >= 9 deg from every
  # joint limit, inside the 60% gravity-torque rule
  iso_poses_rad:
    - [1.1880, 0.8057, -1.2019, 1.6012, 0.4256, -0.1592, 0.6836]
    - [2.0606, 1.1007, -0.9049, 1.3537, -0.5233, 0.4523, 1.0797]
    - [2.0615, 0.7064, -0.9924, 2.1190, -0.0901, 0.4507, 0.5655]
    - [0.4698, 0.6411, -1.2647, 1.6129, 1.1595, -0.4261, 0.8255]
    - [0.5158, 1.2108, -1.3595, 0.6498, 1.0903, -0.1021, 1.1362]

# Divot plate for `arm plate`: kinematic calibration without mocap. The probe tip
# (tool0) is hand guided into each divot in several configurations; the fit uses the
# plate's known divot spacing as its length scale.
# PLACEHOLDER GEOMETRY: every number below needs the plate drawing (needs_drawing: true
# makes `arm plate` flag it on hardware until it is replaced).
plate:
  needs_drawing: true
  # divot seat centres in the plate frame (m): origin at divot 0, x along the first row,
  # z out of the top face, at the height where the probe tip seats in a divot
  divots_m:
    - [0.000, 0.000, 0.0]
    - [0.100, 0.000, 0.0]
    - [0.200, 0.000, 0.0]
    - [0.000, 0.075, 0.0]
    - [0.100, 0.075, 0.0]
    - [0.200, 0.075, 0.0]
    - [0.000, 0.150, 0.0]
    - [0.100, 0.150, 0.0]
    - [0.200, 0.150, 0.0]
  tolerance_mm: 0.02         # divot position tolerance on the drawing
  held_out: [4, 8]           # divots kept out of the fit, to validate it
  approach_cone_deg: 60      # probe axis within this angle of the plate normal (clearance)
  fit_tip: true              # fit a probe-tip offset; stored folded into J7's zero and origin
                             # (its radial part is only reported). false: URDF tool0 as is
  # rough plate frame in base_link (xyz m, rpy rad): sim placement and operator hint
  # only; the fit finds the real pose
  pose_in_base: {xyz: [0.15, -0.375, -0.40], rpy: [0.0, 0.0, 0.0]}

# Dial-indicator cube for repeatability without mocap (`arm repeat --indicators`,
# `arm validate` without mocap). Three orthogonal indicators on a stand touch three
# faces of a cube bolted to the flange, one ISO pose per fixture setup.
# PLACEHOLDERS until the fixture is built.
indicator_cube:
  cube_size_m: 0.04                        # ground cube on the flange
  center_in_flange_m: [0.0, 0.0, 0.025]    # cube centre in the flange frame
  # indicator axes in base_link, one row each (unit, orthogonal): a reading grows
  # when the cube face moves along the row (the indicator sits on that side)
  axes_in_base: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  resolution_m: 1.0e-6                     # 0.001 mm digital indicators
  range_m: 0.0127                          # plunger travel; set at mid travel when zeroing
  serial: {port: null, baud: 9600}         # digital indicators over USB (stub); null: type them
