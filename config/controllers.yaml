controller_manager:
  ros__parameters:
    update_rate: 100  # TODO(Multi-Actuator): Scale up to 1000Hz when real-time kernel (PREEMPT_RT) is configured

    # TODO(Multi-Actuator): Ensure joint_state_broadcaster publishes state array for all connected drives
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # TODO(Multi-Actuator): Configure multi-axis effort controller to accept vector-based commands
    effort_controller:
      type: effort_controllers/JointGroupEffortController

effort_controller:
  ros__parameters:
    # TODO(Multi-Actuator): Define joint names corresponding to multi-actuator kinematic chain (e.g., shoulder, elbow, wrist)
    joints:
      - joint_1
      - joint_2
      - joint_3