controller_manager:
  ros__parameters:
    update_rate: 100  # TODO(Multi-Actuator): Scale up to 1000Hz when real-time kernel (PREEMPT_RT) is configured

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController

effort_controller:
  ros__parameters:
    # NOTE: must match the ros2_control joints generated by the xacro (num_actuators).
    # Trim this list to the first N entries when running with fewer than 16 actuators.
    joints:
      - shoulder_joint
      - elbow_joint
      - wrist_joint
      - joint_4
      - joint_5
      - joint_6
      - joint_7
      - joint_8
      - joint_9
      - joint_10
      - joint_11
      - joint_12
      - joint_13
      - joint_14
      - joint_15
      - joint_16
