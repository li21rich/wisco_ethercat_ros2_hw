# rmd_x4_10.yaml
vendor_id: 0x00202008
product_id: 0x00000000

# RxPDO (Master -> Motor / Command Data)
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0}
      - {index: 0x6060, sub_index: 0, type: int8, command_interface: mode_of_operation, default: 10} # 10 = CST (Torque)
      - {index: 0x6071, sub_index: 0, type: int16, command_interface: effort, factor: 1.0, default: 0}
      - {index: 0x6072, sub_index: 0, type: uint16, command_interface: max_torque, default: 500}

# TxPDO (Motor -> Master / State Data)
tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word}
      - {index: 0x603F, sub_index: 0, type: uint16, state_interface: error_code}
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: 1.0}
      - {index: 0x606C, sub_index: 0, type: int32, state_interface: velocity, factor: 1.0}
      - {index: 0x6077, sub_index: 0, type: int16, state_interface: effort, factor: 1.0}
