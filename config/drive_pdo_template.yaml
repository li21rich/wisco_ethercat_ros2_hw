# PDO map shared by every MyActuator RMD-X drive (CiA402).
#
# Do not put numbers here that differ per model or per joint: the launch file
# fills in vendor/product ids, DC sync, the drive mode, scale factors (with the
# joint's direction and zero offset), 0x6072 and which channel is commanded.
sm:
  - {index: 2, type: output, pdo: rpdo}
  - {index: 3, type: input, pdo: tpdo}
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}   # control word
      - {index: 0x607a, sub_index: 0, type: int32}                # target position (held at actual position outside CSP)
      - {index: 0x60ff, sub_index: 0, type: int32, default: 0}    # target velocity (CSV)
      - {index: 0x6071, sub_index: 0, type: int16, default: 0}    # target torque (CST)
      - {index: 0x6072, sub_index: 0, type: int16}                # max torque, per mille of rated
      - {index: 0x6060, sub_index: 0, type: int8}                 # mode of operation
      - {index: 0x2ffd, sub_index: 0, type: uint8, default: 0}
tpdo:
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}               # status word
      - {index: 0x6064, sub_index: 0, type: int32}                # actual position
      - {index: 0x606c, sub_index: 0, type: int32}                # actual velocity
      - {index: 0x6077, sub_index: 0, type: int16}                # actual torque
      - {index: 0x603f, sub_index: 0, type: uint16}               # error code
      - {index: 0x6061, sub_index: 0, type: int8, state_interface: mode_of_operation}
      - {index: 0x2ffe, sub_index: 0, type: uint8}
